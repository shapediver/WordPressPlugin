<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="ShapeDiver Wordpress Plugin Test Page" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>ShapeDiver App Builder</title>
  <link rel="stylesheet" href="sd-wp.css">
</head>

<body class="shapediver-wordpress-plugin-test-page">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <div id="app-builder-modal-wrapper" style="display: none;">
    <div id="app-builder-modal-content">
      <svg id="app-builder-modal-close-button" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="10" fill="white" />
        <circle cx="10" cy="10" r="9" fill="black" />
        <circle cx="10" cy="10" r="8" fill="white" />
        <line x1="5" y1="5" x2="15" y2="15" stroke="black" />
        <line x1="15" y1="5" x2="5" y2="15" stroke="black" />
      </svg>
      <iframe id="app-builder-iframe" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>
  <button id="app-builder-open-configurator">Open configurator</button>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  <script type="module" src="/src/sd-wp.ts"></script>
</body>

</html>
